name: CI

# PR 与非主分支 push 时只做构建验证和测试，不部署；
# main 分支的 push 由 deploy.yml 负责（含同样的检查 + 部署）。
on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: server/package-lock.json

    - name: Install server dependencies
      working-directory: server
      run: npm ci

    - name: Run server checks
      # npm run check = node --check 语法检查 + node --test 全部后端测试
      working-directory: server
      run: npm run check
