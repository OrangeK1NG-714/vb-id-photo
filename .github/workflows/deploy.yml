name: Deploy ID Photo Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # 创建项目目录
          mkdir -p /var/www/id-photo
          cd /var/www/id-photo

          # 拉取最新代码
          git pull origin main 2>/dev/null || git clone https://github.com/OrangeK1NG-714/vb-id-photo.git .

          # 只安装 server 的依赖(服务器在国内,用镜像源)
          cd server
          npm install --production --registry=https://registry.npmmirror.com

          # 创建必要的目录
          mkdir -p data storage/preview storage/protected

          # 用 PM2 启动或重启服务(固定 3001 端口,避开宝塔占用的 3000)
          pm2 describe id-photo > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            PORT=3001 pm2 restart id-photo --update-env
          else
            PORT=3001 pm2 start index.js --name id-photo -e /var/log/pm2/id-photo-error.log -o /var/log/pm2/id-photo-out.log
          fi

          pm2 save
          echo "✅ ID Photo backend deployed successfully"
