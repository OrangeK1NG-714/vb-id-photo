name: Deploy ID Photo Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: server/package-lock.json

    - name: Verify server code
      # 推送服务器前先在 CI 跑语法检查 + 全部测试（npm run check =
      # node --check + node --test），失败则不部署，避免坏代码上线。
      working-directory: server
      run: |
        npm ci
        npm run check

    - name: Push code to server
      # 服务器连 GitHub 不稳定（GFW 间歇阻断），不再在服务器上 git pull ——
      # CI runner 打包直推。务必排除 storage/ 和 data/：那是线上用户照片
      # 和订单数据，绝不能被覆盖。
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        tar czf - \
          --exclude=.git --exclude="**/node_modules" \
          --exclude="server/storage" --exclude="server/data" --exclude="server/.env*" \
          . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "mkdir -p /var/www/id-photo && cd /var/www/id-photo && tar xzf -"

    - name: Install deps and restart
      uses: appleboy/ssh-action@v1.0.3
      env:
        ID_PHOTO_INTERNAL_STATS_TOKEN: ${{ secrets.ID_PHOTO_INTERNAL_STATS_TOKEN }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        envs: ID_PHOTO_INTERNAL_STATS_TOKEN
        script: |
          # 任何一步失败立即中止，不再静默假成功
          set -e
          cd /var/www/id-photo/server

          # 统计令牌仅从 GitHub Secret 注入，并原子更新既有生产 .env。
          # 不打印令牌，也不允许缺失/弱令牌启动新版本。
          test "${#ID_PHOTO_INTERNAL_STATS_TOKEN}" -ge 32
          test -f .env
          ENV_FILE="$PWD/.env" node <<'NODE'
          const fs = require("node:fs");
          const file = process.env.ENV_FILE;
          const token = process.env.ID_PHOTO_INTERNAL_STATS_TOKEN;
          if (!file || !token || Buffer.byteLength(token) < 32) throw new Error("invalid internal stats token");
          const current = fs.readFileSync(file, "utf8");
          const line = `ID_PHOTO_INTERNAL_STATS_TOKEN=${token}`;
          const next = /^ID_PHOTO_INTERNAL_STATS_TOKEN=.*$/m.test(current)
            ? current.replace(/^ID_PHOTO_INTERNAL_STATS_TOKEN=.*$/m, line)
            : `${current.replace(/\n?$/, "\n")}${line}\n`;
          const temporary = `${file}.tmp-${process.pid}`;
          fs.writeFileSync(temporary, next, { mode: 0o600 });
          fs.renameSync(temporary, file);
          NODE

          # 只安装 server 的依赖(镜像源为主,官方源兜底)
          npm install --production --registry=https://registry.npmmirror.com --no-audit --no-fund || \
            npm install --production --registry=https://registry.npmjs.org --no-audit --no-fund

          # 创建必要的目录
          mkdir -p data storage/preview storage/protected

          # 用 PM2 启动或重启服务(固定 3001 端口,避开宝塔占用的 3000)
          if pm2 describe id-photo > /dev/null 2>&1; then
            PORT=3001 pm2 restart id-photo --update-env
          else
            PORT=3001 pm2 start index.js --name id-photo -e /var/log/pm2/id-photo-error.log -o /var/log/pm2/id-photo-out.log
          fi

          pm2 save

          # 部署后真实健康检查：服务存活，且携正确令牌的回环统计请求可用。
          sleep 1
          curl -sf http://127.0.0.1:3001/health
          curl -sf -H "Authorization: Bearer $ID_PHOTO_INTERNAL_STATS_TOKEN" \
            "http://127.0.0.1:3001/api/internal/stats?days=1" > /dev/null

          echo "✅ ID Photo backend deployed successfully"

    - name: Verify public internal route is hidden
      run: |
        status="$(curl --connect-timeout 10 --max-time 20 -sS -o /dev/null -w '%{http_code}' \
          'https://photo.richardq.tech/api/internal/stats?days=1')"
        test "$status" = "404"

    - name: Bark 通知
      if: always()
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then echo "BARK_KEY 未配置，跳过通知"; exit 0; fi
        if [ "${{ job.status }}" = "success" ]; then
          RESULT="成功"; LEVEL="active"; SOUND="minuet"; GROUP="CI/CD · 成功"
        else
          RESULT="失败"; LEVEL="timeSensitive"; SOUND="alarm"; GROUP="CI/CD · 失败"
        fi
        jq -n \
          --arg key "$BARK_KEY" \
          --arg title "部署$RESULT · ID Photo" \
          --arg body "分支：${{ github.ref_name }} · 提交：${GITHUB_SHA:0:7} · 点击查看运行详情" \
          --arg group "$GROUP" \
          --arg level "$LEVEL" \
          --arg sound "$SOUND" \
          --arg id "cicd-${{ github.repository_id }}-deploy" \
          --arg icon "https://stats.richardq.tech/icons/id-photo.png" \
          --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '{device_key:$key,title:$title,subtitle:"GitHub Actions",body:$body,group:$group,level:$level,sound:$sound,id:$id,icon:$icon,url:$url,isArchive:"1"}' \
          | curl -fsS -m 10 -X POST "https://api.day.app/push" \
              -H "Content-Type: application/json; charset=utf-8" -d @- \
          || echo "Bark 通知发送失败（不影响构建）"
